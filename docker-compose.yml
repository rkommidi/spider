version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
    command: python app.py
    restart: unless-stopped

  scraper:
    build: .
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    command: python run_scraper.py
    profiles:
      - scraper
