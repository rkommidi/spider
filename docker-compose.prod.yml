version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: spider-postgres
    environment:
      - POSTGRES_DB=spider
      - POSTGRES_USER=spider
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spider"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  web:
    image: raghav0401/spider-app:latest
    container_name: spider-web
    ports:
      - "5000:5000"
    volumes:
      # Only mount data directory for database persistence (SQLite)
      - spider-data:/app/data
    env_file:
      - .env
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_DEBUG=False
      - DATABASE_URL=postgresql://spider:${POSTGRES_PASSWORD:-changeme}@postgres:5432/spider
    command: python app.py
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  scraper:
    image: raghav0401/spider-app:latest
    container_name: spider-scraper
    volumes:
      # Share data directory with web service
      - spider-data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://spider:${POSTGRES_PASSWORD:-changeme}@postgres:5432/spider
    command: python run_scraper.py
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - scraper

volumes:
  spider-data:
    driver: local
  postgres-data:
    driver: local
