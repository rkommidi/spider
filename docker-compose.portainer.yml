services:
  postgres:
    image: postgres:16-alpine
    container_name: spider-postgres
    environment:
      - POSTGRES_DB=spider
      - POSTGRES_USER=spider
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spider"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spider-network

  web:
    image: raghav0401/spider-app:latest
    container_name: spider-web
    ports:
      - "5000:5000"
    volumes:
      - spider-data:/app/data
    environment:
      - WEBSITE_USERNAME=${WEBSITE_USERNAME}
      - WEBSITE_PASSWORD=${WEBSITE_PASSWORD}
      - DATABASE_URL=postgresql://spider:${POSTGRES_PASSWORD}@postgres:5432/spider
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_DEBUG=False
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - spider-network

  scraper:
    image: raghav0401/spider-app:latest
    container_name: spider-scraper
    volumes:
      - spider-data:/app/data
    environment:
      - WEBSITE_USERNAME=${WEBSITE_USERNAME}
      - WEBSITE_PASSWORD=${WEBSITE_PASSWORD}
      - DATABASE_URL=postgresql://spider:${POSTGRES_PASSWORD}@postgres:5432/spider
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - scraper
    networks:
      - spider-network

volumes:
  spider-data:
    driver: local
  postgres-data:
    driver: local

networks:
  spider-network:
    driver: bridge
