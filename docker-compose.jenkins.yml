# Jenkins CI/CD Server Configuration
# This docker-compose file sets up a local Jenkins server for CI/CD automation

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: spider-jenkins
    restart: unless-stopped
    privileged: true
    user: root
    ports:
      - "8080:8080"      # Jenkins Web UI
      - "50000:50000"    # Jenkins agent port
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    volumes:
      # Jenkins home directory (persist data)
      - jenkins_home:/var/jenkins_home

      # Docker socket (for Docker-in-Docker)
      - /var/run/docker.sock:/var/run/docker.sock

      # Project source code
      - ./:/workspace/spider:ro

      # Docker binary (for running docker commands from Jenkins)
      - /usr/local/bin/docker:/usr/bin/docker:ro
    networks:
      - jenkins-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - "com.spider.service=jenkins"
      - "com.spider.environment=cicd"

  # Jenkins Blue Ocean (Modern UI - Optional)
  # Uncomment to use the modern Jenkins interface
  # jenkins-blueocean:
  #   image: jenkinsci/blueocean:latest
  #   container_name: spider-jenkins-blueocean
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #     - "50000:50000"
  #   volumes:
  #     - jenkins_home:/var/jenkins_home
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   networks:
  #     - jenkins-network

volumes:
  jenkins_home:
    driver: local
    name: spider_jenkins_home

networks:
  jenkins-network:
    driver: bridge
    name: spider_jenkins_network
